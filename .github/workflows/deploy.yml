name: Deploy to 1Panel

# 推送到 master 即自动构建并部署到 1Panel 的 .NET 容器
# 也可在 Actions 页面手动触发（可选择历史提交用于回滚）
on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

# 同一分支不并发部署，避免两次推送互相覆盖服务器上的文件
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_VERSION: 10.0.x
  PROJECT: ClouderyApi/ClouderyApi.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release ClouderyApi.sln

      - name: 提高测试库连接上限
        # mysql 服务容器默认 max_connections=151，而这个套件每个测试类自建一个库 + 宿主，
        # 空闲连接容易撞上限（Too many connections）；run 镜像自带 mysql 客户端，root/root 可直连。
        run: mysql -h 127.0.0.1 -uroot -proot -e "SET GLOBAL max_connections=500;"

      - name: Test
        env:
          # 集成测试需要真实 MySQL；测试会自建/自删一次性数据库
          CLOUDERY_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=root"
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --output publish

      - name: 清理不应上服务器的文件
        run: |
          # appsettings.json 含数据库 / OSS 密钥且不入库，服务器上那份必须保留，绝不能覆盖
          rm -f publish/appsettings.json
          rm -f publish/ClouderyApi.pdb publish/ClouderyApi.exe publish/web.config
          rm -rf publish/uploads
          echo "本次将上传的文件数：$(find publish -type f | wc -l)"
          du -sh publish

      - name: 部署前自检服务器配置
        # 只读校验，不改任何东西。放在 scp 之前：密钥缺失时整个部署中止，
        # 服务器上的旧 DLL 不被覆盖，下次重启容器仍能正常起来。
        # 反过来放在后面的话，DLL 已覆盖而容器不重启，等到下次重启才炸，日志里只有一个
        # InvalidOperationException，排查成本高得多。
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          command_timeout: 60s
          script: |
            set -e
            APP_DIR="${{ secrets.DEPLOY_TARGET }}"
            echo "自检服务器配置 $APP_DIR/appsettings.json"

            # 1Panel 宿主是 Ubuntu/Debian 一般自带 python3，但没有就明说，
            # 不要让它以 "command not found" 的形式中止，那看不出是自检环境问题。
            if ! command -v python3 >/dev/null 2>&1; then
              echo "::error::服务器上没有 python3，无法解析 appsettings.json，自检跳过"
              echo "::error::请人工确认 $APP_DIR/appsettings.json 里 Scforge:AccessTokenSecret 已配置且长度 ≥ 32"
              exit 1
            fi

            # 用 python3 解析而不是 grep：只要 JSON 合法就一定读得准。
            # 密钥值只进 shell 变量，绝不 echo，unset 后才继续。
            SECRET="$(APP_DIR="$APP_DIR" python3 - <<'PY'
            import json, os, sys

            path = os.path.join(os.environ["APP_DIR"], "appsettings.json")
            try:
                with open(path, encoding="utf-8") as handle:
                    config = json.load(handle)
            except FileNotFoundError:
                print("__MISSING_FILE__")
                sys.exit(0)
            except Exception as exc:
                print("__BAD_JSON__" + str(exc))
                sys.exit(0)

            value = (config.get("Scforge") or {}).get("AccessTokenSecret") or ""
            print(value if value else "__EMPTY__")
            PY
            )"

            case "$SECRET" in
              __MISSING_FILE__)
                echo "::error::服务器上找不到 appsettings.json，本次部署已中止（未覆盖任何文件）"
                echo "::error::按 DEPLOY.md 第一节第 2 步，把本地配置 scp 到 $APP_DIR/ 下"
                exit 1 ;;
              __BAD_JSON__*)
                echo "::error::appsettings.json 不是合法 JSON：${SECRET#__BAD_JSON__}"
                exit 1 ;;
              __EMPTY__)
                echo "::error::Scforge:AccessTokenSecret 未配置（空值），本次部署已中止（未覆盖任何文件）"
                echo "::error::隐私插件的解锁令牌靠它 HMAC 签名，缺失时服务会拒绝启动。生成：openssl rand -base64 48"
                exit 1 ;;
            esac

            if [ "${#SECRET}" -lt 32 ]; then
              echo "::error::Scforge:AccessTokenSecret 只有 ${#SECRET} 个字符，少于 32，本次部署已中止"
              exit 1
            fi

            unset SECRET
            echo "自检通过：配置存在、JSON 合法、签名密钥长度合规（密钥值不落日志）"

      - name: 上传到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 密钥若带密码短语则填 DEPLOY_PASSPHRASE；用无密码短语的部署密钥时留空即可
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          source: "publish/*"
          target: ${{ secrets.DEPLOY_TARGET }}
          # 去掉 tar 里的 publish/ 前缀，让文件直接落在应用目录
          strip_components: 1
          overwrite: true
          # 关键：不删除目标目录中的其它文件，保留 appsettings.json 与 uploads/
          rm: false

      - name: 重启容器并检查
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # 密钥若带密码短语则填 DEPLOY_PASSPHRASE；用无密码短语的部署密钥时留空即可
          passphrase: ${{ secrets.DEPLOY_PASSPHRASE }}
          command_timeout: 5m
          script: |
            set -e
            CONTAINER="${{ secrets.DEPLOY_CONTAINER }}"
            # 迁移与种子改为显式执行：失败会因 set -e 中止部署，避免带着未迁移的库重启
            echo "执行数据库迁移与种子 ..."
            if ! docker exec "$CONTAINER" dotnet ClouderyApi.dll --migrate --seed; then
              echo "容器默认工作目录不可用，改用 -w /app 重试"
              docker exec -w /app "$CONTAINER" dotnet ClouderyApi.dll --migrate --seed
            fi

            echo "重启容器 $CONTAINER ..."
            docker restart "$CONTAINER"
            sleep 5

            if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER")" != "true" ]; then
              echo "::error::容器未在运行，下面是最近 100 行日志"
              docker logs --tail 100 "$CONTAINER" || true
              exit 1
            fi

            docker ps --filter "name=$CONTAINER" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            HEALTH="${{ secrets.DEPLOY_HEALTH_URL }}"
            if [ -n "$HEALTH" ]; then
              echo "健康检查 $HEALTH ..."
              curl -fsS --max-time 15 "$HEALTH"
              echo ""
            fi

            echo "部署完成 $(date -u +%FT%TZ)"
