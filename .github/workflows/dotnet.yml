name: Build

# 推送 master 由 deploy.yml 负责（它会先构建 + 测试再部署），这里只做 PR 检查，避免重复构建
on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release ClouderyApi.sln -warnaserror
    - name: Test
      env:
        # 集成测试需要真实 MySQL（MySQL 的 RAND() 与条件 UPDATE 无法用内存库替代）
        CLOUDERY_TEST_MYSQL: "server=127.0.0.1;port=3306;user=root;password=root"
      run: dotnet test --no-build --configuration Release --verbosity normal
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        path: ./ClouderyApi/bin/Release/net10.0/*
