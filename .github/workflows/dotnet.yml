name: Build

# 推送 master 由 deploy.yml 负责（它会先构建 + 测试再部署），这里只做 PR 检查，避免重复构建
on:
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration Release ClouderyApi
    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        path: ./ClouderyApi/bin/Release/net10.0/*
